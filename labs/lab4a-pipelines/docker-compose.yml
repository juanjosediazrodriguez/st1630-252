# docker-compose.yml — Lab 4a (ST1630-2026-2, S11)
#
# Levanta Apache Airflow 2.9 en modo LocalExecutor (todo corre en un
# solo contenedor de scheduler/webserver, sin Celery/Redis -- no lo
# necesitamos para el volumen de este lab) con PostgreSQL como backend
# de metadatos. Construye la imagen desde ./Dockerfile (Airflow + Java
# 17 + pyspark + delta-spark).
#
# Uso:
#   docker compose up airflow-init   # una sola vez: crea la BD y el usuario admin
#   docker compose up -d             # levanta webserver + scheduler
#   # UI en http://localhost:8080  (usuario: admin / clave: admin)

x-airflow-common: &airflow-common
  build: .
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "True"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "True"
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    # El CSV del dataset del lab, solo lectura -- generado una vez con
    # datos/gen_dataset.py y versionado en el repo, no se regenera en
    # cada arranque del contenedor.
    - ./datos:/opt/airflow/data/raw:ro
    # Volumen con nombre (no una carpeta del repo) para las tablas
    # Bronze/Silver/Gold que el DAG escribe en cada corrida -- así los
    # outputs generados nunca terminan commiteados por accidente.
    - lab4a-data:/opt/airflow/data/output
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5
    restart: always

  airflow-init:
    <<: *airflow-common
    container_name: lab4a-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin --password admin \
          --firstname ST1630 --lastname Lab4a \
          --role Admin --email admin@st1630.local
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"

  airflow-webserver:
    <<: *airflow-common
    container_name: lab4a-airflow-webserver
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 5

  airflow-scheduler:
    <<: *airflow-common
    container_name: lab4a-airflow-scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

volumes:
  postgres-db-volume:
  lab4a-data:
